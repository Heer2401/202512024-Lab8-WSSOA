name: CampusConnect Microservices CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Containerize Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, product-service, order-service]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service }}/package-lock.json'

      - name: Install Dependencies (${{ matrix.service }})
        run: |
          cd ${{ matrix.service }}
          npm ci || npm install

      - name: Execute Automated Unit Tests (${{ matrix.service }})
        run: |
          cd ${{ matrix.service }}
          npm test

      - name: Build Docker Image (${{ matrix.service }})
        run: |
          docker build -t ${{ matrix.service }}:${{ github.sha }} -t ${{ matrix.service }}:v1 -t ${{ matrix.service }}:latest ./${{ matrix.service }}
