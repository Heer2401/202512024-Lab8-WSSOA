apiVersion: v1
kind: Secret
metadata:
  name: campusconnect-secrets
  namespace: lab8
  labels:
    app.kubernetes.io/name: campusconnect
    app.kubernetes.io/part-of: campusconnect-platform
type: Opaque
# Security Note: Never commit production credentials/passwords to GitHub!
# For MongoDB Atlas (External Managed Database per Lab 7 & 8 requirement):
# Replace the stringData values with your Atlas connection string:
# mongodb+srv://<username>:<password>@<cluster>.mongodb.net/<dbname>?retryWrites=true&w=majority
stringData:
  # Option A: In-cluster MongoDB service (default fallback)
  MONGO_URI_USER: "mongodb://mongodb:27017/userdb"
  MONGO_URI_PRODUCT: "mongodb://mongodb:27017/productdb"
  MONGO_URI_ORDER: "mongodb://mongodb:27017/orderdb"

  # Option B: MongoDB Atlas (Uncomment and replace with your Atlas credentials):
  # MONGO_URI_USER: "mongodb+srv://student:Password123@cluster0.mongodb.net/userdb?retryWrites=true&w=majority"
  # MONGO_URI_PRODUCT: "mongodb+srv://student:Password123@cluster0.mongodb.net/productdb?retryWrites=true&w=majority"
  # MONGO_URI_ORDER: "mongodb+srv://student:Password123@cluster0.mongodb.net/orderdb?retryWrites=true&w=majority"

